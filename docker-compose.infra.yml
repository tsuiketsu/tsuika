name: tsuika

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tsuika-api
    restart: always
    ports:
      - "8081:8000"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HOST_URL: ${HOST_URL}
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@imrayy-postgres/${POSTGRES_DB_NAME}"

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      CORS_ORIGIN_BROWSER_EXTENSION: ${CORS_ORIGIN_BROWSER_EXTENSION}

      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-false}
      RESEND_API_KEY: ${RESEND_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

      MEILI_HOST: ${MEILI_HOST}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - api_data:/app/data
    networks:
      - imrayy-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GENAI_API_KEY: ${VITE_GENAI_API_KEY}
    container_name: tsuika
    restart: always
    ports:
      - "4321:3000"
    depends_on:
      - api
    networks:
      - imrayy-network

networks:
  imrayy-network:
    name: imrayy-network
    external: true

volumes:
  meili_data:
  api_data:
