pre-commit:
  parallel: true
  jobs:
    - name: formatting
      run: bunx --bun @biomejs/biome format --write {staged_files}

    - name: linting
      glob: "*.{ts,tsx}"
      run: bunx --bun @biomejs/biome lint --write {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bun run lint:commit
